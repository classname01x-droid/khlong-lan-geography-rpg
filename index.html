<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- มือถือ: ไม่ซูม/ไม่เลื่อนหน้าโดยไม่ตั้งใจ · viewport-fit=cover เพื่ออ่านขอบรอยบาก (safe-area-inset) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#10141f" />
    <title>Geography Mystery RPG: ปริศนาลับแห่งคลองลาน</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10141f; overflow: hidden; overscroll-behavior: none;
        touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; touch-action: none; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
